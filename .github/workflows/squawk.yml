# Cloud deployment: poll Bluesky, write squawks, commit the outputs. GitHub Pages (set to
# serve this branch's root) then publishes web/ticker.html and data/squawks.json.
#
# Secrets (one of):
#   ANTHROPIC_API_KEY        - Claude API, pay per token
#   CLAUDE_CODE_OAUTH_TOKEN  - Claude subscription via Claude Code (run `claude setup-token`
#                              on your Mac and paste the token as this secret)
# Optional, to publish the ticker from a PRIVATE runner repo to a PUBLIC Pages repo:
#   PAGES_REPO (variable)    - the public repo, e.g. philsmith871010-stack/pwlb-squawk-feed
#   and ONE of:
#   PAGES_DEPLOY_KEY         - private half of an SSH deploy key whose public half is a
#                              write-enabled deploy key on the public repo (no browser needed)
#   PAGES_REPO_TOKEN         - fine-grained personal access token, Contents: read/write
name: squawk

# Triggered externally (a scheduler calling `gh workflow run` / the API), so there is no
# `schedule:` here: GitHub's own cron would double-run the job against the same branch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: squawk
  cancel-in-progress: false

jobs:
  squawk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-dev

      - name: Restore event log
        uses: actions/cache/restore@v4
        with:
          path: data/squawk.sqlite
          key: squawk-db-${{ github.run_id }}
          restore-keys: squawk-db-

      - name: Install Claude Code (subscription mode)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Poll and write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SQUAWK_WRITER_BACKEND: ${{ secrets.ANTHROPIC_API_KEY != '' && 'anthropic' || 'claude-cli' }}
          SQUAWK_DB_PATH: data/squawk.sqlite
        run: |
          uv run squawk poll
          uv run squawk write --market-tick

      - name: Save event log
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/squawk.sqlite
          key: squawk-db-${{ github.run_id }}

      - name: Commit outputs
        run: |
          git config user.name "squawk-bot"
          git config user.email "squawk-bot@users.noreply.github.com"
          git add data/squawks.json data/squawks.ndjson
          if git diff --cached --quiet; then echo "no new squawks"; exit 0; fi
          git commit -m "squawk: $(date -u +'%Y-%m-%d %H:%M') update"
          git pull --rebase
          git push

      # Public Pages repo: only the ticker page and the two output files leave this repo.
      - name: Build site
        if: vars.PAGES_REPO != ''
        run: |
          rm -rf site && mkdir -p site/web site/data
          cp index.html .nojekyll site/
          cp web/ticker.html site/web/
          cp data/squawks.json data/squawks.ndjson site/data/
      - name: Publish to the public Pages repo (deploy key)
        if: vars.PAGES_REPO != '' && env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.PAGES_DEPLOY_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: ${{ vars.PAGES_REPO }}
          publish_branch: main
          publish_dir: ./site
          user_name: squawk-bot
          user_email: squawk-bot@users.noreply.github.com
          commit_message: "squawk update"
          force_orphan: true
      - name: Publish to the public Pages repo (token)
        if: vars.PAGES_REPO != '' && env.HAS_KEY != 'true'
        env:
          HAS_KEY: ${{ secrets.PAGES_DEPLOY_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_REPO_TOKEN }}
          external_repository: ${{ vars.PAGES_REPO }}
          publish_branch: main
          publish_dir: ./site
          user_name: squawk-bot
          user_email: squawk-bot@users.noreply.github.com
          commit_message: "squawk update"
          force_orphan: true
